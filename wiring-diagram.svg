<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1320" viewBox="0 0 1600 1320" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="30%" r="90%">
      <stop offset="0" stop-color="#141a38"/>
      <stop offset="1" stop-color="#0a0e21"/>
    </radialGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity="0.5"/>
    </filter>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7f8db0"/>
    </marker>
  </defs>

  <rect width="1600" height="1320" fill="url(#bgGrad)"/>

  <!-- ============ ЗАГОЛОВОК ============ -->
  <text x="800" y="46" text-anchor="middle" font-size="30" font-weight="700" fill="#f4f7fb">Схема подключения «Умный дом» — версия с Wi-Fi (ESP8266)</text>
  <text x="800" y="76" text-anchor="middle" font-size="15" fill="#aab4d3">Arduino Nano <tspan fill="#8fd2ff">+</tspan> ESP-01 (ESP8266) <tspan fill="#8fd2ff">+</tspan> реле / MOSFET / шаговый двигатель</text>

  <!-- ============ ESP8266 ESP-01 ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="470" width="220" height="190" rx="12" fill="#0f2335" stroke="#38e0b0" stroke-width="2"/>
    <rect x="60" y="470" width="220" height="34" rx="12" fill="#0e1b2c"/>
    <text x="170" y="493" text-anchor="middle" font-size="15" font-weight="700" fill="#38e0b0">ESP-01 Wi-Fi</text>
    <text x="170" y="518" text-anchor="middle" font-size="11" fill="#8fd2ff">ESP8266 · AT-прошивка</text>
    <!-- пины внутри -->
    <text x="80" y="550" font-size="12" fill="#d9e2f5">TX  ➜  Nano A2</text>
    <text x="80" y="585" font-size="12" fill="#d9e2f5">RX  ➜  Nano A3</text>
    <text x="80" y="620" font-size="12" fill="#ff8a80">VCC → 3.3V</text>
    <text x="80" y="655" font-size="12" fill="#ff8a80">CH_PD → 3.3V</text>
    <circle cx="298" cy="520" r="4" fill="#f4f7fb"/>
    <circle cx="298" cy="550" r="4" fill="#f4f7fb"/>
    <circle cx="298" cy="590" r="4" fill="#f4f7fb"/>
    <circle cx="298" cy="650" r="4" fill="#000"/>
  </g>
  <text x="170" y="450" text-anchor="middle" font-size="12" fill="#7f8db0">GND модуля → общий GND (Nano)</text>

  <!-- ============ ARDUINO NANO ============ -->
  <g filter="url(#shadow)">
    <rect x="430" y="430" width="360" height="520" rx="16" fill="#0c4658" stroke="#8fd2ff" stroke-width="2.5"/>
    <text x="610" y="470" text-anchor="middle" font-size="22" font-weight="700" fill="#eaf6ff">Arduino Nano</text>
    <text x="610" y="496" text-anchor="middle" font-size="13" fill="#bcdcf0">ATmega328P · 5V</text>
    <!-- CH340 -->
    <rect x="530" y="820" width="160" height="40" rx="6" fill="#0b3040"/>
    <text x="610" y="847" text-anchor="middle" font-size="12" fill="#9fd4ea">USB-UART</text>
    <!-- USB -->
    <rect x="560" y="870" width="100" height="22" rx="3" fill="#11213a" stroke="#bcc7e0" stroke-width="1.2"/>
    <text x="610" y="886" text-anchor="middle" font-size="10" fill="#dce3f3">USB</text>
    <text x="610" y="936" text-anchor="middle" font-size="12" fill="#aab4d3">USB-кабель → ПК (питание и прошивка)</text>
  </g>

  <!-- левый набор пинов (D13..VIN) -->
  <g font-size="11" fill="#dfe8fa" text-anchor="end">
    <text x="420" y="478">D13</text>
    <text x="420" y="508">3V3</text>
    <text x="420" y="538">AREF</text>
    <text x="420" y="568">A0</text>
    <text x="420" y="598">A1</text>
    <text x="420" y="628">A2 (RX от ESP)</text>
    <text x="420" y="658">A3 (TX до ESP)</text>
    <text x="420" y="688">A4</text>
    <text x="420" y="718">A5</text>
    <text x="420" y="748">A6</text>
    <text x="420" y="778">A7</text>
    <text x="420" y="808">5V</text>
    <text x="420" y="838">RST</text>
    <text x="420" y="868">GND</text>
    <text x="420" y="898">VIN</text>
  </g>
  <!-- правый набор пинов (D12..5V) -->
  <g font-size="11" fill="#dfe8fa">
    <text x="798" y="478">D12 ➜ DS18B20</text>
    <text x="798" y="508">D11 ➜ шторы/ULN</text>
    <text x="798" y="538">D10 ➜ шторы/ULN</text>
    <text x="798" y="568">D9 ➜ шторы/ULN</text>
    <text x="798" y="598">D8 ➜ шторы/ULN</text>
    <text x="798" y="628">D7 ➜ реле CH4</text>
    <text x="798" y="658">D6 ➜ реле CH3</text>
    <text x="798" y="688">D5 ➜ MOSFET вент</text>
    <text x="798" y="718">D4 ➜ реле CH2</text>
    <text x="798" y="748">D3 ➜ MOSFET LED</text>
    <text x="798" y="778">D2 ➜ реле CH1</text>
    <text x="798" y="808">TX</text>
    <text x="798" y="838">RX</text>
    <text x="798" y="868">GND</text>
    <text x="798" y="898">5V</text>
  </g>

  <!-- ============ ПРОВОДА ESP → NANO ============ -->
  <g stroke="#38e0b0" stroke-width="2.4" fill="none">
    <path d="M298 520 C 330 520, 330 628, 430 628"/> <!-- A2 -->
    <path d="M298 550 C 340 550, 340 658, 430 658"/> <!-- A3 -->
  </g>
  <g stroke="#ff8a80" stroke-width="2.4" fill="none">
    <path d="M298 590 C 320 590, 320 508, 430 508"/> <!-- VCC → 3V3 -->
  </g>
  <g stroke="#555" stroke-width="2.4" fill="none">
    <path d="M298 650 L 280 650 L 280 868 L 430 868"/> <!-- GND -->
  </g>

  <!-- ============ РЕЛЕЙНЫЙ МОДУЛЬ ============ -->
  <g filter="url(#shadow)">
    <rect x="1050" y="430" width="310" height="370" rx="12" fill="#1a2340" stroke="#ffd54f" stroke-width="2"/>
    <rect x="1050" y="430" width="310" height="36" rx="12" fill="#141c33"/>
    <text x="1205" y="454" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd54f">Релейный модуль ×4 (5В)</text>
    <text x="1205" y="480" text-anchor="middle" font-size="11" fill="#7283a8">CH1..CH4 · COM/NO · 5В логика</text>
  </g>
  <!-- входы реле (левая грань) -->
  <circle cx="1050" cy="510" r="4" fill="#ffd54f"/>
  <circle cx="1050" cy="590" r="4" fill="#ffd54f"/>
  <circle cx="1050" cy="670" r="4" fill="#ffd54f"/>
  <circle cx="1050" cy="750" r="4" fill="#ffd54f"/>
  <text x="1040" y="514" text-anchor="end" font-size="11" fill="#ffd54f">CH1</text>
  <text x="1040" y="594" text-anchor="end" font-size="11" fill="#ffd54f">CH2</text>
  <text x="1040" y="674" text-anchor="end" font-size="11" fill="#ffd54f">CH3</text>
  <text x="1040" y="754" text-anchor="end" font-size="11" fill="#ffd54f">CH4</text>

  <!-- ============ MOSFET (2 шт) ============ -->
  <g filter="url(#shadow)">
    <rect x="1050" y="830" width="160" height="60" rx="10" fill="#12283a" stroke="#4fc3f7" stroke-width="2"/>
    <text x="1130" y="855" text-anchor="middle" font-size="12" font-weight="700" fill="#4fc3f7">MOSFET</text>
    <text x="1130" y="877" text-anchor="middle" font-size="10" fill="#9fd4ea">LED (D3)</text>
    <rect x="1050" y="930" width="160" height="60" rx="10" fill="#12283a" stroke="#4fc3f7" stroke-width="2"/>
    <text x="1130" y="955" text-anchor="middle" font-size="12" font-weight="700" fill="#4fc3f7">MOSFET</text>
    <text x="1130" y="977" text-anchor="middle" font-size="10" fill="#9fd4ea">Вентилятор (D5)</text>
  </g>

  <!-- ============ ULN2003 ============ -->
  <g filter="url(#shadow)">
    <rect x="1050" y="1040" width="310" height="160" rx="12" fill="#132335" stroke="#ffd28a" stroke-width="2"/>
    <rect x="1050" y="1040" width="310" height="34" rx="12" fill="#101c2b"/>
    <text x="1205" y="1064" text-anchor="middle" font-size="15" font-weight="700" fill="#ffd28a">Драйвер ULN2003</text>
    <text x="1205" y="1184" text-anchor="middle" font-size="11" fill="#a8b6cf">5В · 4 входа (шторы 28BYJ-48)</text>
  </g>
  <circle cx="1050" cy="1100" r="4" fill="#ffd28a"/>
  <circle cx="1050" cy="1130" r="4" fill="#ffd28a"/>
  <circle cx="1050" cy="1160" r="4" fill="#ffd28a"/>
  <circle cx="1050" cy="1190" r="4" fill="#ffd28a"/>

  <!-- ============ DS18B20 ============ -->
  <g filter="url(#shadow)">
    <rect x="1050" y="300" width="180" height="76" rx="10" fill="#101b30" stroke="#4fc3f7" stroke-width="2"/>
    <text x="1140" y="326" text-anchor="middle" font-size="13" font-weight="700" fill="#4fc3f7">DS18B20</text>
    <text x="1140" y="350" text-anchor="middle" font-size="10" fill="#9fd4ea">опция · D12 · 4.7к→5V</text>
  </g>
  <circle cx="1050" cy="340" r="4" fill="#4fc3f7"/>

  <!-- ============ ПРОВОДА от NANO вправо ============ -->
  <g stroke="#dfe8fa" stroke-width="2.4" fill="none">
    <path d="M790 778 C 850 778, 900 480, 1050 510"/>  <!-- D2 → CH1 -->
    <path d="M790 718 C 850 718, 890 560, 1050 590"/>  <!-- D4 → CH2 -->
    <path d="M790 658 C 850 658, 880 640, 1050 670"/>  <!-- D6 → CH3 -->
    <path d="M790 628 C 850 628, 870 720, 1050 750"/>  <!-- D7 → CH4 -->
    <path d="M790 748 C 860 748, 960 860, 1050 860"/>  <!-- D3 → MOSFET -->
    <path d="M790 688 C 860 688, 970 960, 1050 960"/>  <!-- D5 → MOSFET -->
    <path d="M790 598 C 870 598, 990 1100, 1050 1100"/>  <!-- D8 → ULN -->
    <path d="M790 568 C 880 568, 1000 1130, 1050 1130"/>  <!-- D9 -->
    <path d="M790 538 C 890 538, 1010 1160, 1050 1160"/>  <!-- D10 -->
    <path d="M790 508 C 900 508, 1020 1190, 1050 1190"/>  <!-- D11 -->
    <path d="M790 478 C 850 478, 880 340, 1050 340"/>  <!-- D12 → DS18B20 -->
  </g>

  <!-- ============ НАГРУЗКИ (справа) ============ -->
  <g filter="url(#shadow)">
    <!-- Нагреватель -->
    <rect x="1460" y="455" width="110" height="60" rx="10" fill="#2b1a30" stroke="#c77dff" stroke-width="2"/>
    <text x="1515" y="481" text-anchor="middle" font-size="12" font-weight="700" fill="#e3b8ff">Нагреватель</text>
    <text x="1515" y="500" text-anchor="middle" font-size="10" fill="#c77dff">220В</text>
    <!-- Свет -->
    <rect x="1460" y="535" width="110" height="60" rx="10" fill="#2b1a30" stroke="#c77dff" stroke-width="2"/>
    <text x="1515" y="561" text-anchor="middle" font-size="12" font-weight="700" fill="#e3b8ff">Свет</text>
    <text x="1515" y="580" text-anchor="middle" font-size="10" fill="#c77dff">220В</text>
    <!-- Насос -->
    <rect x="1460" y="615" width="110" height="60" rx="10" fill="#2a2410" stroke="#ffbb3d" stroke-width="2"/>
    <text x="1515" y="641" text-anchor="middle" font-size="12" font-weight="700" fill="#ffd7a1">Насос</text>
    <text x="1515" y="660" text-anchor="middle" font-size="10" fill="#ffbb3d">12В · реле CH3</text>
    <!-- Кондиционер -->
    <rect x="1460" y="695" width="110" height="60" rx="10" fill="#2b1a30" stroke="#c77dff" stroke-width="2"/>
    <text x="1515" y="721" text-anchor="middle" font-size="12" font-weight="700" fill="#e3b8ff">Кондиционер</text>
    <text x="1515" y="740" text-anchor="middle" font-size="10" fill="#c77dff">220В</text>
    <!-- LED-лента -->
    <rect x="1460" y="845" width="110" height="60" rx="10" fill="#2a2410" stroke="#ffbb3d" stroke-width="2"/>
    <text x="1515" y="871" text-anchor="middle" font-size="12" font-weight="700" fill="#ffd7a1">LED-лента</text>
    <text x="1515" y="890" text-anchor="middle" font-size="10" fill="#ffbb3d">12В · PWM</text>
    <!-- Вентилятор -->
    <rect x="1460" y="945" width="110" height="60" rx="10" fill="#2a2410" stroke="#ffbb3d" stroke-width="2"/>
    <text x="1515" y="971" text-anchor="middle" font-size="12" font-weight="700" fill="#ffd7a1">Вентилятор AC</text>
    <text x="1515" y="990" text-anchor="middle" font-size="10" fill="#ffbb3d">12В · PWM</text>
    <!-- Мотор штор -->
    <rect x="1460" y="1105" width="110" height="70" rx="10" fill="#241f12" stroke="#ffd28a" stroke-width="2"/>
    <text x="1515" y="1131" text-anchor="middle" font-size="12" font-weight="700" fill="#ffe3b0">28BYJ-48</text>
    <text x="1515" y="1151" text-anchor="middle" font-size="10" fill="#b8a878">Шторы · 5В</text>
  </g>

  <!-- провода реле → нагрузки -->
  <g stroke="#7f8db0" stroke-width="2.2" fill="none">
    <path d="M1360 510 L 1460 485"/>
    <path d="M1360 590 L 1460 565"/>
    <path d="M1360 670 L 1460 645"/>
    <path d="M1360 750 L 1460 725"/>
  </g>
  <g stroke="#4fc3f7" stroke-width="2.2" fill="none">
    <path d="M1210 890 L 1460 875"/>
    <path d="M1210 990 L 1460 975"/>
  </g>
  <g stroke="#ffd28a" stroke-width="2.2" fill="none">
    <path d="M1360 1160 L 1460 1140"/>
  </g>

  <!-- ============ БП 12В ============ -->
  <g filter="url(#shadow)">
    <rect x="60" y="1050" width="240" height="150" rx="12" fill="#1a2038" stroke="#ffbb3d" stroke-width="2"/>
    <text x="180" y="1082" text-anchor="middle" font-size="15" font-weight="700" fill="#ffbb3d">Блок питания 12В</text>
    <text x="180" y="1106" text-anchor="middle" font-size="11" fill="#9aa5c4">220В → 12В (2–5 А)</text>
    <text x="90" y="1140" font-size="12" fill="#ffd7a1">+12V </text>
    <text x="90" y="1168" font-size="12" fill="#888">GND </text>
  </g>
  <circle cx="88" cy="1140" r="4" fill="#ffbb3d"/>
  <circle cx="88" cy="1168" r="4" fill="#888"/>

  <!-- ============ ШИНЫ ПИТАНИЯ ============ -->
  <g stroke="#ff6b6b" stroke-width="3" fill="none">
    <path d="M1050 1230 L 1590 1230"/>
  </g>
  <g stroke="#888" stroke-width="3" fill="none">
    <path d="M40 1260 L 1590 1260"/>
  </g>
  <g stroke="#ffbb3d" stroke-width="3" fill="none">
    <path d="M300 1290 L 1590 1290"/>
  </g>
  <text x="1600" y="1226" text-anchor="end" font-size="12" fill="#ff8a80" font-weight="700">+5V шина</text>
  <text x="1600" y="1256" text-anchor="end" font-size="12" fill="#aaa" font-weight="700">GND шина</text>
  <text x="1600" y="1286" text-anchor="end" font-size="12" fill="#ffbb3d" font-weight="700">+12V шина</text>

  <!-- отводы к нагрузкам -->
  <g stroke="#ffbb3d" stroke-width="2.4" fill="none">
    <path d="M1515 1290 L 1515 1005"/>  <!-- вентилятор -->
    <path d="M1530 1290 L 1530 905"/>   <!-- LED -->
    <path d="M1545 1290 L 1545 675"/>   <!-- насос -->
  </g>
  <g stroke="#888" stroke-width="2.4" fill="none">
    <path d="M1495 1260 L 1495 1140"/>  <!-- мотор GND -->
  </g>
  <!-- реле питение 5V -->
  <g stroke="#ff6b6b" stroke-width="2.4" fill="none">
    <path d="M1180 1230 L 1180 800"/>
  </g>
  <g stroke="#888" stroke-width="2.4" fill="none">
    <path d="M1220 1260 L 1220 800"/>
  </g>
  <!-- ULN 5V -->
  <g stroke="#ff6b6b" stroke-width="2.4" fill="none">
    <path d="M1100 1230 L 1100 1200"/>
  </g>

  <!-- ============ ЛЕГЕНДА МАТЕРИАЛОВ ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="160" width="360" height="270" rx="12" fill="#11172e" stroke="#7283a8" stroke-width="1.5"/>
    <text x="60" y="192" font-size="15" font-weight="700" fill="#f4f7fb">Материалы</text>
    <text x="60" y="220" font-size="12.5" fill="#c6d0e8">• Arduino Nano (ATmega328P)</text>
    <text x="60" y="244" font-size="12.5" fill="#c6d0e8">• ESP8266 ESP-01 + стабилизатор 3.3В</text>
    <text x="60" y="268" font-size="12.5" fill="#c6d0e8">• Релейный модуль ×4 (5В, COM/NO)</text>
    <text x="60" y="292" font-size="12.5" fill="#c6d0e8">• 2× MOSFET-модуль (LED, вентилятор)</text>
    <text x="60" y="316" font-size="12.5" fill="#c6d0e8">• ULN2003 + шаговый мотор 28BYJ-48</text>
    <text x="60" y="340" font-size="12.5" fill="#c6d0e8">• DS18B20 + резистор 4,7 кОм (опция)</text>
    <text x="60" y="364" font-size="12.5" fill="#c6d0e8">• БП 12В, нагрузка 220В, LED-лента 12В</text>
    <text x="60" y="388" font-size="12.5" fill="#c6d0e8">• Насос 12В, вентилятор 12В, USB-кабель</text>
    <text x="60" y="412" font-size="12.5" fill="#c6d0e8">• Провода dupont, силовые, клеммники</text>
  </g>

  <!-- ============ ЛЕГЕНДА ПРОВОДОВ ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="450" width="360" height="210" rx="12" fill="#11172e" stroke="#7283a8" stroke-width="1.5"/>
    <text x="60" y="482" font-size="15" font-weight="700" fill="#f4f7fb">Цвета проводов</text>
    <circle cx="72" cy="510" r="6" fill="#38e0b0"/><text x="90" y="514" font-size="12.5" fill="#c6d0e8">Wi-Fi UART (ESP ↔ Nano A2/A3)</text>
    <circle cx="72" cy="536" r="6" fill="#dfe8fa"/><text x="90" y="540" font-size="12.5" fill="#c6d0e8">Сигналы D2–D12 → модули</text>
    <circle cx="72" cy="562" r="6" fill="#ff6b6b"/><text x="90" y="566" font-size="12.5" fill="#c6d0e8">+5В (модули реле/ULN)</text>
    <circle cx="72" cy="588" r="6" fill="#888"/><text x="90" y="592" font-size="12.5" fill="#c6d0e8">GND (общая земля)</text>
    <circle cx="72" cy="614" r="6" fill="#ffbb3d"/><text x="90" y="618" font-size="12.5" fill="#c6d0e8">+12В (насос, LED, вентилятор)</text>
    <circle cx="72" cy="640" r="6" fill="#c77dff"/><text x="90" y="644" font-size="12.5" fill="#c6d0e8">~220В (только через реле!)</text>
  </g>

  <!-- ============ ПРИМЕЧАНИЯ ============ -->
  <g filter="url(#shadow)">
    <rect x="40" y="680" width="360" height="340" rx="12" fill="#101730" stroke="#ff8fa8" stroke-width="1.5"/>
    <text x="60" y="712" font-size="15" font-weight="700" fill="#ff8fa8">Важно!</text>
    <text x="60" y="740" font-size="12.5" fill="#e6eefc">⚠ 220В подключается ТОЛЬКО к</text>
    <text x="60" y="762" font-size="12.5" fill="#e6eefc">клеммам COM/NO реле. Arduino и ESP</text>
    <text x="60" y="784" font-size="12.5" fill="#e6eefc">гальванически изолированы от сети.</text>
    <text x="60" y="814" font-size="12.5" fill="#e6eefc">• Все GND соединить вместе (общая земля).</text>
    <text x="60" y="838" font-size="12.5" fill="#e6eefc">• ESP-01 питать от стабилизатора 3.3В</text>
    <text x="60" y="860" font-size="12.5" fill="#e6eefc">  (не от 5В, не от пина 3V3 Nano).</text>
    <text x="60" y="890" font-size="12.5" fill="#e6eefc">• TX↔RX соединяются перекрёстно:</text>
    <text x="60" y="912" font-size="12.5" fill="#e6eefc">  ESP TX→A2, ESP RX→A3.</text>
    <text x="60" y="942" font-size="12.5" fill="#e6eefc">• Нагреватель/свет/кондиционер — 220В</text>
    <text x="60" y="964" font-size="12.5" fill="#e6eefc">  через реле CH1/CH2/CH4.</text>
    <text x="60" y="994" font-size="12.5" fill="#e6eefc">• Насос 12В — реле CH3; LED и вентилятор</text>
    <text x="60" y="1016" font-size="12.5" fill="#e6eefc">  12В — ШИМ через MOSFET.</text>
  </g>

